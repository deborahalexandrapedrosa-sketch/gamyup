services:
  # Backend: API + Socket.io + banco SQLite
  - type: web
    name: gamyup-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://gamyup-client.onrender.com
      - key: NODE_ENV
        value: production

  # Frontend: build estático do React/Vite
  - type: web
    name: gamyup-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gamyup-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
